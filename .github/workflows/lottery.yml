name: Stock Lottery

on:
  schedule:
    - cron: '0 3 * * *'  # UTC 03:00 = Asia/Taipei 11:00，每日執行
    - cron: '0 3 * * 1'  # UTC 03:00 週一，keep-alive commit
  workflow_dispatch:       # 手動觸發

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * 1'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp
        run: echo "Last updated: $(date -u)" > .github/last-updated.txt

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .github/last-updated.txt
          git commit -m "chore: update last active timestamp"
          git push

  run:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: Boren.StockLottery
        run: dotnet build -c Release

      - name: Cache SQLite DB
        uses: actions/cache@v4
        with:
          path: Boren.StockLottery/bin/Release/net8.0/data/lottery.db
          key: lottery-db-${{ github.run_id }}
          restore-keys: lottery-db-

      - name: Restore Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > Boren.StockLottery/bin/Release/net8.0/credentials.json
          mkdir -p "Boren.StockLottery/bin/Release/net8.0/data/token"
          echo '${{ secrets.GOOGLE_TOKEN }}' > "Boren.StockLottery/bin/Release/net8.0/data/token/Google.Apis.Auth.OAuth2.Responses.TokenResponse-user"

      - name: Run
        working-directory: Boren.StockLottery
        run: dotnet run --project Boren.StockLottery.csproj -c Release --no-build
        env:
          AppSettings__PremiumThresholdPercent: ${{ vars.PREMIUM_THRESHOLD_PERCENT }}
          AppSettings__MaxSubscriptionPrice: ${{ vars.MAX_SUBSCRIPTION_PRICE }}
